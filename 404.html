<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Aaron Ladron</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#030409" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #030409; --fg: #e6fbff; --muted: #6c8796; --y: #fcee0a; --c: #00f0ff; --r: #ff2a6d; color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); font-family: "Share Tech Mono", ui-monospace, monospace;
      background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    }
    h1 {
      font-family: "Orbitron", sans-serif; font-weight: 900; font-size: clamp(72px, 22vw, 180px); line-height: 1;
      color: var(--fg); text-shadow: -3px 0 var(--r), 3px 0 var(--c), 0 0 24px rgba(0,240,255,.5);
      animation: gl 2.5s steps(1) infinite;
    }
    @keyframes gl { 0%, 92% { transform: none; } 94% { transform: translate(-4px, 1px); } 96% { transform: translate(3px, -1px); } }
    .err { color: var(--r); margin: 18px 0 8px; }
    p { color: var(--muted); max-width: 46ch; margin-inline: auto; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 28px; padding: 12px 20px; background: var(--y); color: #000; text-decoration: none;
      font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    }
    a:hover, a:focus-visible { background: #fff53d; outline: none; box-shadow: 0 0 24px rgba(252,238,10,.6); }
    @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <div class="err">✖ Error: file not found (rm -rf, probablement)</div>
    <p>Cette page n'existe plus. Le site a été refait de zéro, et ce fichier n'a pas survécu à la migration.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
